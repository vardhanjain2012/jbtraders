<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Building Materials</title>
    <!-- Tailwind CSS for rapid, maintainable styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Navigation / Header -->
    <header class="bg-blue-800 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <div id="header-business-name" class="text-2xl font-bold mb-2 sm:mb-0">
                <!-- Injected via config -->
            </div>
            <div class="flex gap-4">
                <a id="header-call" href="#"
                    class="flex items-center gap-2 bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded-lg transition">
                    📞 Call Us
                </a>
                <a id="header-wa" href="#" target="_blank"
                    class="flex items-center gap-2 bg-green-500 hover:bg-green-400 text-white px-4 py-2 rounded-lg transition font-semibold">
                    💬 WhatsApp
                </a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-white py-12 border-b">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-4">Premium Construction Materials</h1>
            <p class="text-lg text-gray-600 max-w-2xl mx-auto">Supplying top-quality cement, aggregates, and flooring
                solutions for residential and commercial projects.</p>
        </div>
    </section>

    <!-- Products Section -->
    <section class="py-12 max-w-6xl mx-auto px-4">
        <h2 class="text-3xl font-bold text-center mb-8 text-blue-900">Our Products</h2>
        <!-- Product Cards injected via config -->
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        </div>
    </section>

    <div class="max-w-6xl mx-auto px-4 py-12 grid grid-cols-1 md:grid-cols-2 gap-12">

        <!-- Contact & Location -->
        <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-2xl font-bold mb-6 text-blue-900">Visit Our Store</h2>
            <div class="space-y-4 text-gray-700">
                <p class="flex items-start gap-3">
                    <span class="text-xl">📍</span>
                    <span>
                        <strong>Address:</strong><br>
                        <span id="contact-address"><!-- Injected via config --></span>
                    </span>
                </p>
                <a id="contact-map" href="#" target="_blank"
                    class="inline-block mt-2 text-blue-600 hover:text-blue-800 underline font-medium">
                    View on Google Maps &rarr;
                </a>

                <hr class="my-4">

                <p class="flex items-center gap-3">
                    <span class="text-xl">📞</span>
                    <strong>Phone:</strong> <a id="contact-call" href="#"
                        class="text-blue-600 hover:underline"><!-- Injected --></a>
                </p>
                <p class="flex items-start gap-3">
                    <span class="text-xl">⏰</span>
                    <span>
                        <strong>Hours:</strong><br>
                        <span id="contact-hours"><!-- Injected via config --></span>
                    </span>
                </p>
            </div>
        </div>

        <!-- WhatsApp Enquiry Form -->
        <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-2xl font-bold mb-6 text-blue-900">Send an Enquiry</h2>
            <form id="enquiryForm" onsubmit="sendToWhatsApp(event)" class="space-y-4">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Your Name *</label>
                        <input type="text" id="name" required
                            class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <!-- Removed "required" from the input and updated label -->
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Phone Number (Optional)</label>
                        <input type="tel" id="phone"
                            class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <!-- Checkboxes injected via config -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Interested In (Select
                        Multiple):</label>
                    <div id="checkbox-grid" class="grid grid-cols-2 gap-2 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Message / Quantity details
                        (Optional)</label>
                    <textarea id="details" rows="2"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <button type="submit"
                    class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg transition flex justify-center items-center gap-2">
                    💬 Send via WhatsApp
                </button>
            </form>
        </div>

    </div>

    <footer class="bg-gray-900 text-gray-400 text-center py-6">
        <p id="footer-text"><!-- Injected via config --></p>
    </footer>

    <!-- 1. Load the external configuration file FIRST -->
    <script src="config.js"></script>

    <!-- 2. Logic that uses the configuration -->
    <script>
        // ==========================================
        // AUTO-POPULATE WEBSITE DATA
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {

            document.getElementById('page-title').innerText = `${config.businessName} | Building Materials`;
            document.getElementById('header-business-name').innerText = config.businessName;
            document.getElementById('footer-text').innerHTML = `&copy; ${new Date().getFullYear()} ${config.businessName}. All rights reserved.`;

            document.getElementById('header-call').href = `tel:${config.phoneLink}`;
            document.getElementById('header-wa').href = `https://wa.me/${config.whatsappNumber}`;
            document.getElementById('contact-call').href = `tel:${config.phoneLink}`;
            document.getElementById('contact-call').innerText = config.phoneDisplay;

            document.getElementById('contact-address').innerHTML = config.addressHTML;
            document.getElementById('contact-map').href = config.mapLink;
            document.getElementById('contact-hours').innerHTML = `Mon - Sat: ${config.hoursMonSat} <br> Sunday: ${config.hoursSun}`;

            const productGrid = document.getElementById('product-grid');
            const checkboxGrid = document.getElementById('checkbox-grid');

            config.products.forEach(product => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center font-semibold text-lg hover:shadow-md transition";
                card.innerText = product;
                productGrid.appendChild(card);

                const label = document.createElement('label');
                label.className = "flex items-center gap-2 cursor-pointer";
                label.innerHTML = `<input type="checkbox" name="product" value="${product}" class="w-4 h-4 text-blue-600"> ${product}`;
                checkboxGrid.appendChild(label);
            });
        });

        // ==========================================
        // WHATSAPP ENQUIRY LOGIC
        // ==========================================
        function sendToWhatsApp(e) {
            e.preventDefault();

            // Name is mandatory, so we will always have it
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim(); // Now optional
            const details = document.getElementById('details').value.trim();

            const checkboxes = document.querySelectorAll('input[name="product"]:checked');
            let selectedProducts = [];
            checkboxes.forEach((cb) => {
                selectedProducts.push(cb.value);
            });

            // Format products for the sentence
            const productText = selectedProducts.length > 0 ? selectedProducts.join(", ") : "your products";

            // Build the conversational string: "Hi I am xyz and would like to enquire about abc products."
            let messageText = `Hi I am ${name} and would like to enquire about ${productText}.`;

            // Append optional details if they were provided
            if (details) {
                messageText += `\n\n*Additional Details:* ${details}`;
            }

            // Append optional phone if they provided one
            if (phone) {
                messageText += `\n*Alternate Contact Number:* ${phone}`;
            }

            // URI Encode the entire string to safely pass it in the URL
            const finalEncodedMessage = encodeURIComponent(messageText);

            window.open(`https://wa.me/${config.whatsappNumber}?text=${finalEncodedMessage}`, '_blank');
        }
    </script>
</body>

</html>
